<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sand Art</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">

  <!-- The Arcade SDK, root-relative and major-pinned (GAME_INTEGRATION §2),
       then the sand kernel companion from the SAME directory: the wrapper
       fetches its .wasm from beside itself, so the two must be siblings. -->
  <script src="/sdk/v3/arcade-sdk.js"></script>
  <script src="/sdk/v3/arcade-sim-sand.js"></script>
  <script>
    Arcade.init({ gameId: 'sand-art' });
  </script>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Sand Art</h1>
      <span class="status" id="status" aria-live="polite"></span>
      <div class="actions">
        <button id="photo" class="ghost" type="button" title="Put a picture behind the jar">Picture</button>
        <button id="gallery" class="ghost" type="button" title="Your saved jars">Gallery</button>
        <button id="clear" class="ghost" type="button" title="Empty this jar">Empty</button>
      </div>
    </header>

    <!-- The jar. The canvas is sized by JS to the largest 3:5 box that fits
         the stage; everything drawn on it is one scaled blit of the kernel's
         framebuffer, smoothing off, so each cell reads as a grain. -->
    <div class="stage" id="stage">
      <div class="jar" id="jar">
        <canvas id="view" aria-label="A jar of coloured sand"></canvas>
      </div>
    </div>

    <!-- The controls travel as one block: under the jar on a portrait phone,
         beside it in landscape (style.css). The palette and toolbar are
         strips that scroll sideways when the row is too narrow for them. -->
    <div class="controls">
      <!-- The picture behind the jar: how strong it shows, whether it shows,
           the landing overlay, and taking it away. Hidden without one. -->
      <div class="picture" id="picture" hidden>
        <label for="opacity"><span>Picture</span></label>
        <input id="opacity" type="range" min="10" max="100" step="5" value="60" aria-label="Picture strength">
        <button id="show-picture" class="ghost small toggle" type="button" aria-pressed="true">Hide</button>
        <button id="landing" class="ghost small toggle" type="button" aria-pressed="false" title="Show where sand can land right now">Landing</button>
        <button id="remove-picture" class="ghost small" type="button">Remove</button>
      </div>

      <!-- One option per tool (flow, radius). Hidden when the tool has none. -->
      <div class="options" id="options" hidden>
        <label for="option"><span id="option-label">Flow</span></label>
        <input id="option" type="range" min="1" max="10" step="1" value="1">
        <output id="option-value" for="option">1</output>
      </div>

      <div class="palette strip" id="palette" role="radiogroup" aria-label="Sand colour"></div>

      <nav class="toolbar strip" id="toolbar" role="radiogroup" aria-label="Tool"></nav>

      <!-- A gutter under the strips: on an iPhone the home-indicator swipe
           zone runs along the bottom edge, and a strip that ended there lost
           sideways scrolls to it. Nothing interactive sits in the gutter. -->
      <div class="gutter" aria-hidden="true"></div>
    </div>
  </main>

  <!-- The three sheets (the picture fit, the gallery, the Library) are
       built by JS when opened: importer.js, gallery-ui.js, library-ui.js. -->
  <script type="module" src="main.js"></script>

  <!-- Service worker for offline standalone visits, loopback-guarded so dev
       edits are never masked by a stale cache (GAME_INTEGRATION §10). -->
  <script>
    if ('serviceWorker' in navigator &&
        !/^(127\.|localhost$|0\.0\.0\.0$|::1$)/.test(location.hostname)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: '/sand-art/' })
          .catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
